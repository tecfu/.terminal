# kitty.conf — tecfu dotfiles
# Installed as symlink: ~/.config/kitty/kitty.conf -> dotfiles/.terminal/.kitty.conf

# Force explicit CSI-u encoding for Shift+Enter.
# tmux cannot negotiate the kitty keyboard protocol with kitty, which would
# otherwise degrade shift+enter to plain \r (submits instead of newline).
# pi decodes CSI-u natively, so this also matches behavior outside tmux.
map shift+enter send_text all \e[13;2u

# Copy mode: open scrollback in nvim (normal mode navigation + yank),
# matching ctrl+shift+space in alacritty.
# The scrollback buffer arrives on stdin. Do NOT use -M: it applies before
# the vimrc loads and every buffer-touching line in ~/.vimrc then errors out
# (E21), aborting config mid-load. Lock the buffer AFTER config load instead;
# buftype=nofile makes :q prompt-free since edits are discarded anyway.
map ctrl+shift+space show_scrollback
scrollback_pager nvim -c 'setlocal buftype=nofile nomodifiable nomodified' -
