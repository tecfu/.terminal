# mouse wheel scrolling
set -g mouse on

# don't delay ESC waiting for escape sequences (default 500ms)
set -sg escape-time 10

# let tmux see modifier combos like Ctrl+Shift+K
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ctrl+j = page up, ctrl+k = page down (no prefix), like alacritty
bind -n C-k copy-mode \; send-keys -X page-up
bind -n C-j copy-mode \; send-keys -X page-down

# keep paging once copy-mode is already open (both emacs and vi tables)
bind -T copy-mode    C-k send-keys -X page-up
bind -T copy-mode    C-j send-keys -X page-down
bind -T copy-mode-vi C-k send-keys -X page-up
bind -T copy-mode-vi C-j send-keys -X page-down

# interferes with pi's vimmode plugin
# unbind -q -T copy-mode-vi :
# unbind -q -T copy-mode :

# press i in copy mode to exit back to the pi live pane, then forward "i" twice
bind -T copy-mode    i send-keys -X cancel \; send-keys i
bind -T copy-mode-vi i send-keys -X cancel \; send-keys i

# shift+; (arrives as ':') : exit copy mode, send raw ESC byte (what your
# caps-lock->escape remap produces), pause so pi parses it as its own key,
# then forward ':'
bind -T copy-mode    ":" send-keys -X cancel \; run-shell "sleep 0.05" \; send-keys -H 0x1b \; send-keys -H 0x1b \; send-keys ":"
bind -T copy-mode-vi ":" send-keys -X cancel \; run-shell "sleep 0.05" \; send-keys -H 0x1b \; send-keys -H 0x1b \; send-keys ":"

# escape exits copy mode back to the live pane
bind -T copy-mode    Escape send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
 
